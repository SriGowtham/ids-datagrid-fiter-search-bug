include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml

stages:
  - security
  - build

variables:
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  DS_STATIC_REACHABILITY_ENABLED: "true"
  DS_SKIP_IF_NO_SUPPORTED_FILES: "true"

gitlab-advanced-sast:
  stage: security
  tags:
    - k8s
    - dsa-runner
  variables:
    GITLAB_ADV_SAST_INCR_SCAN: "true"

dependency-scanning:
  stage: security
  tags:
    - k8s
    - dsa-runner

build:
  stage: build
  tags:
    - k8s
    - dsa-runner
  variables:
    KUBERNETES_CPU_REQUEST: 14
    KUBERNETES_CPU_LIMIT: 14
  image: node:20
  script:
    - npm ci
    - npm run build
